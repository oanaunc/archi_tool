<script>
document.addEventListener('DOMContentLoaded', () => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const onView = (el, fn, opts) => { if (!el) return; const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { fn(); io.disconnect(); } }), opts || { threshold: .35 }); io.observe(el); };
  // Counters
  document.querySelectorAll('.at-stats [data-count]').forEach(el => {
    const end = +el.dataset.count; if (reduce) return;
    onView(el, () => { const t0 = performance.now(), d = 1400; const step = t => { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))).toLocaleString('en-US'); if (k < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
  });
  // Plan + terminal
  const holder = document.getElementById('at-plan'), term = document.getElementById('at-term');
  const script = [
    ['OPEN "Cedar House.archi"', 'Opened Cedar House.archi — 408 objects, 59 building elements.'],
    ['WALL 0,1500 @6000,0 @0,8500 @-6000,0 C', '4 walls · Limestone · 300 mm · height 6200'],
    ['WALL 6000,0 @5000,0 @0,7500 @-5000,0', 'Cedar tower · 7200 mm'],
    ['WINDOW  Width 1300  Height 5300  Sill 1600', 'Window strip hosted in wall #6'],
    ['DOOR  Width 1100  Style Single', 'Pivot entrance door placed'],
    ['SLAB Walls  Thickness 250', 'Floor slab 21.0 × 8.5 m'],
    ['ROOF Kind Shed  Pitch 4  Overhang 1300', 'Roof plate with deep overhang'],
    ['STAIR Top "Upper Floor"', '18 risers · 177.8 mm · rule check OK'],
    ['ROOM Pick', 'Living 01 · 46.4 m²'],
    ['DIMLINEAR  Architectural 1:100', 'Dimension 21000'],
    ['COMPONENT Tree  Birch', '6 trees placed'],
    ['VS Realistic', 'Sun: golden hour · shadows on']
  ];
  let run = 0;
  function play() {
    const my = ++run; if (term) term.innerHTML = '';
    const svg = holder && holder.querySelector('svg'); if (svg) { svg.classList.remove('play'); void svg.getBoundingClientRect(); svg.classList.add('play'); }
    if (!term) return;
    let li = 0;
    const next = () => {
      if (my !== run || li >= script.length) { if (my === run) term.insertAdjacentHTML('beforeend', '<span class="c">Command:</span> <span class="cur"></span>'); return; }
      const [cmd, out] = script[li++]; const line = document.createElement('div'); line.innerHTML = '<span class="c">Command:</span> '; term.appendChild(line); term.scrollTop = term.scrollHeight;
      const txt = document.createElement('span'); line.appendChild(txt); let ci = 0;
      const type = () => { if (my !== run) return; if (ci < cmd.length) { txt.textContent += cmd[ci++]; setTimeout(type, reduce ? 0 : 28 + Math.random() * 40); } else { const o = document.createElement('div'); o.className = 'o'; o.textContent = out; term.appendChild(o); term.scrollTop = term.scrollHeight; while (term.children.length > 14) term.removeChild(term.firstChild); setTimeout(next, reduce ? 0 : 380); } };
      type();
    };
    next();
  }
  if (holder) fetch(holder.dataset.src).then(r => r.text()).then(t => { holder.innerHTML = t; onView(holder, play, { threshold: .25 }); }).catch(() => {});
  const rb = document.getElementById('at-replay'); if (rb) rb.addEventListener('click', play);
  // Feature explorer
  const areasEl = document.getElementById('at-areas'), listEl = document.getElementById('at-list'), q = document.getElementById('at-q'), countEl = document.getElementById('at-count');
  if (areasEl) fetch('downloads/archi-tool/features.json?v={{V}}').then(r => r.json()).then(data => {
    const keys = Object.keys(data.areas); let current = keys[0];
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const render = () => {
      const term = (q.value || '').trim().toLowerCase(); let items = [];
      if (term) keys.forEach(k => data.areas[k].items.forEach(it => { if ((it[0] + ' ' + it[1] + ' ' + it[2]).toLowerCase().includes(term)) items.push([...it, data.areas[k].name]); }));
      else items = data.areas[current].items.map(it => [...it, '']);
      [...areasEl.children].forEach(b => b.setAttribute('aria-selected', !term && b.dataset.k === current));
      listEl.innerHTML = items.slice(0, 400).map(it => `<li><strong>${esc(it[0])}</strong>${it[1] && !/^[—–-]+$/.test(it[1].trim()) ? `<code>${esc(it[1].split(/[ (,]/)[0])}</code>` : ''}<small>${esc(it[3] ? it[3] + ' · ' : '')}${esc(it[2])}</small></li>`).join('') || '<li>No matching feature yet.</li>';
      countEl.textContent = term ? `${items.length} found` : `${items.length} in ${data.areas[current].name}`;
    };
    areasEl.innerHTML = keys.map(k => `<button type="button" role="tab" data-k="${k}">${esc(data.areas[k].name)}<b>${data.areas[k].items.length}</b></button>`).join('');
    areasEl.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; current = b.dataset.k; q.value = ''; render(); });
    q.addEventListener('input', render); render();
  }).catch(() => {});
  // ---- Tutorial studio (same player as the Photo Editor page) ----
  (function () {
    const app = document.querySelector('.at-page .pe-app'); if (!app) return;
    const data = JSON.parse(app.getAttribute('data-tutorials'));
    const $ = id => document.getElementById(id);
    const v = $('pe-video'), steps = $('pe-steps'), fill = $('pe-fill'), marks = $('pe-marks'), time = $('pe-time'), speed = $('pe-speed');
    const tools = [...document.querySelectorAll('.at-page .pe-tool')]; let cur = 0, lastK = -1, rate = 1;
    const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + ('0' + t % 60).slice(-2); };
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    function layoutMarks() { if (!v.duration) return; [...marks.children].forEach(m => m.style.left = (m.dataset.t / v.duration * 100) + '%'); }
    function sync() {
      const d = data[cur], t = v.currentTime; let k = 0;
      d.steps.forEach((s, i) => { if (t >= s[0] - 0.05) k = i; });
      [...steps.children].forEach((li, i) => { li.classList.toggle('is-now', i === k); li.classList.toggle('is-done', i < k); });
      if (k !== lastK) { lastK = k; const li = steps.children[k]; if (li) { const top = li.offsetTop - steps.offsetTop; if (top < steps.scrollTop || top + li.offsetHeight > steps.scrollTop + steps.clientHeight) steps.scrollTop = Math.max(0, top - 8); } }
      fill.style.width = (v.duration ? t / v.duration * 100 : 0) + '%';
      time.textContent = fmt(t) + ' / ' + (v.duration ? fmt(v.duration) : d.dur);
    }
    function render() {
      const d = data[cur]; steps.innerHTML = ''; marks.innerHTML = ''; lastK = -1; steps.scrollTop = 0;
      $('pe-title').textContent = d.title; $('pe-summary').textContent = d.summary;
      $('at-lesson').textContent = 'Lesson ' + d.n + ' of ' + data.length + ' · ' + d.dur;
      const nx = data[(cur + 1) % data.length];
      $('pe-next').innerHTML = 'Next: <button type="button" class="pe-link">' + esc(nx.title) + ' →</button>';
      $('pe-next').querySelector('.pe-link').onclick = () => select((cur + 1) % data.length, true);
      d.steps.forEach((s, i) => {
        const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
        b.innerHTML = '<span class="pe-n">' + (i + 1) + '</span><span class="pe-t"><b>' + esc(s[1]) + '</b>' + (s[2] ? '<i>' + esc(s[2]) + '</i>' : '') + '</span><span class="pe-at">' + fmt(s[0]) + '</span>';
        b.onclick = () => { v.currentTime = s[0] + 0.05; start(); };
        li.appendChild(b); steps.appendChild(li);
        const m = document.createElement('i'); m.dataset.t = s[0]; marks.appendChild(m);
      });
      layoutMarks(); sync();
    }
    function start() { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    function select(i, autoplay) {
      cur = i; tools.forEach((b, j) => { b.classList.toggle('is-active', j === i); b.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
      const d = data[i]; v.poster = d.poster; v.src = d.video; v.playbackRate = rate; v.setAttribute('aria-label', 'Screen recording: ' + d.title); render(); if (autoplay) start();
    }
    tools.forEach((b, i) => b.onclick = () => select(i, true));
    $('pe-play').onclick = start;
    $('pe-toggle').onclick = () => v.paused ? start() : v.pause();
    speed.onclick = () => { rate = rate === 1 ? 1.5 : rate === 1.5 ? 2 : 1; v.playbackRate = rate; speed.textContent = rate + '×'; };
    $('pe-full').onclick = () => (v.requestFullscreen || v.webkitRequestFullscreen || v.webkitEnterFullscreen || function () {}).call(v);
    v.addEventListener('click', () => v.paused ? start() : v.pause());
    v.addEventListener('play', () => { app.classList.add('is-playing'); $('pe-toggle').textContent = 'Pause'; });
    v.addEventListener('pause', () => { app.classList.remove('is-playing'); $('pe-toggle').textContent = 'Play'; });
    v.addEventListener('timeupdate', sync); v.addEventListener('loadedmetadata', () => { v.playbackRate = rate; layoutMarks(); sync(); });
    v.addEventListener('ended', () => select((cur + 1) % data.length, true));
    document.querySelector('.at-page .pe-scrub').addEventListener('click', function (e) { const r = this.getBoundingClientRect(); if (v.duration) { v.currentTime = (e.clientX - r.left) / r.width * v.duration; start(); } });
    document.querySelector('.at-page .pe-toolbar').addEventListener('keydown', e => {
      if (!['ArrowDown', 'ArrowUp', 'ArrowRight', 'ArrowLeft'].includes(e.key)) return;
      e.preventDefault(); const n = (cur + ((e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1) + data.length) % data.length; select(n, false); tools[n].focus();
    });
    if (!reduce) new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && e.intersectionRatio > .45) { if (v.paused && !v.ended) start(); } else if (!e.isIntersecting) v.pause(); }), { threshold: [0, .45] }).observe(v);
    render();
  })();
  // ---- Lighting slider ----
  (function () {
    const ba = document.getElementById('pe-ba'); if (!ba) return;
    const range = ba.querySelector('.pe-ba-range'), base = 'images/apps/archi-tool/renders/', Q = '.jpg?v={{V}}';
    range.addEventListener('input', () => ba.style.setProperty('--pos', range.value + '%'));
    const tabs = [...document.querySelectorAll('.at-page .pe-ba-tab')];
    tabs.forEach(b => b.onclick = () => {
      tabs.forEach(x => x.classList.toggle('is-active', x === b));
      document.getElementById('pe-ba-after').src = base + b.dataset.a + Q; document.getElementById('pe-ba-before').src = base + b.dataset.b + Q;
      document.getElementById('pe-ba-la').textContent = b.dataset.la; document.getElementById('pe-ba-lb').textContent = b.dataset.lb;
      document.querySelector('.at-cmdline code').textContent = 'RENDERPRESET ' + b.dataset.lb.replace(' ', '');
      range.value = 50; ba.style.setProperty('--pos', '50%');
    });
    // a gentle sweep the first time the slider comes into view
    if (!reduce) { const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; io.disconnect(); const t0 = performance.now();
      const f = t => { const k = Math.min(1, (t - t0) / 2200), p = 50 + 32 * Math.sin(k * Math.PI * 2) * (1 - k); range.value = p; ba.style.setProperty('--pos', p + '%'); if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }), { threshold: .6 }); io.observe(ba); }
  })();
  // ---- Hero window parallax ----
  (function () {
    const shot = document.querySelector('.at-page .pe-hero-shot');
    if (!shot || reduce || !matchMedia('(pointer:fine)').matches) return;
    shot.addEventListener('mousemove', e => { const r = shot.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; shot.style.setProperty('--rx', (-y * 6) + 'deg'); shot.style.setProperty('--ry', (x * 8) + 'deg'); });
    shot.addEventListener('mouseleave', () => { shot.style.removeProperty('--rx'); shot.style.removeProperty('--ry'); });
  })();
});
</script>
