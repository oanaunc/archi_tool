# Builds the Oanarina Archi Tool engine (ArchiCore) and runs its tests on Windows and Linux.
# Each run also publishes its log to the branch ci-log-<os>, so it can be read with plain git.
name: Portable engine
on:
  push:
    branches: [main]
    paths: ["app/Sources/ArchiCore/**", "app/Tests/**", "app/Package.swift", ".github/workflows/portable-engine.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: portable-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift (Windows)
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
      - name: Install Swift (Linux)
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: Build and test
        id: tests
        continue-on-error: true
        shell: bash
        working-directory: app
        run: |
          set -o pipefail
          swift --version 2>&1 | tee ../ci.log
          if ! swift build --target ArchiCore 2>&1 | tee -a ../ci.log; then
            echo "=== build failed; verbose rebuild to name the failing compile job" | tee -a ../ci.log
            swift build --target ArchiCore -v -Xswiftc -disable-batch-mode > ../verbose.log 2>&1 || true
            grep -n -A12 -E "Assertion|Stack dump|Program arguments|exception [0-9]" ../verbose.log | grep -vE "^[0-9]+-\s*$" | cut -c1-400 | head -80 | tee -a ../ci.log
            grep -B1 "exception [0-9]" ../verbose.log | grep -oE "\-primary-file [^ ]+" | sort -u | tee -a ../ci.log
            exit 1
          fi
          echo "=== building tests" | tee -a ../ci.log
          swift build --build-tests 2>&1 | tee -a ../ci.log
          echo "=== running tests (40 min limit)" | tee -a ../ci.log
          timeout 40m swift test --skip-build 2>&1 | tee -a ../ci.log
      - name: Publish the log to ci-log-${{ runner.os }}
        if: always()
        shell: bash
        run: |
          os=$(echo "${{ runner.os }}" | tr 'A-Z' 'a-z')
          mkdir -p /tmp/cilog && cd /tmp/cilog
          cp "$GITHUB_WORKSPACE/ci.log" full.log 2>/dev/null || echo "no log" > full.log
          {
            echo "commit ${GITHUB_SHA} · run ${GITHUB_RUN_ID} · outcome ${{ steps.tests.outcome }}"
            grep -E "error:|exception|primary-file|Assertion|Stack dump|===|Test Suite 'All tests'|Executed [0-9]+ tests|failed \(|Fatal error|Build complete" full.log | head -300
            echo "--- last lines"; tail -25 full.log
          } > summary.txt
          git init -q . && git checkout -q -b "ci-log-$os"
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI ${os} ${GITHUB_SHA::12} ${{ steps.tests.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "ci-log-$os"
      - name: Fail if the tests failed
        if: steps.tests.outcome != 'success'
        shell: bash
        run: exit 1
